name: Deck-ready index

# Rebuilds index/deck-ready.json, the list of ports with a Deck or Linux x86_64 build, every week.
# Sources: ports.json in this repo, maintainers' .recomp.json files (GitHub code search) and GitHub
# topics. No third-party port table is read.
# - New projects are added and changed ones updated. Projects that stop qualifying stay one cycle with
#   a missing_since date, then are removed.
# - The file is committed to the branch the run was started on (main for the schedule) only when it
#   changed. The change summary is in the run summary.
# - Pushes made with GITHUB_TOKEN do not trigger CI, yet the app's Import ports matching reads this file
#   (download names, projects the catalog lacks). So before committing, this run builds the app and runs
#   its live-list test (`live_lists_still_match_...`, ignored in normal runs, which use a pinned copy in
#   testdata/import/): a list that would stop known ports matching, or tick ordinary folders, fails here.
# - The builder refuses to publish a list that shrank by more than 30 percent (a failed source
#   would look like that); rerun with allow_shrink once the drop is confirmed real.

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: Publish even if the list shrank by more than 30 percent
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: deck-ready-index
  cancel-in-progress: false

jobs:
  build:
    name: Build and commit the index
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Test the builder
        run: python3 -I tools/test_deck_ready_index.py

      - name: Build the index
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
          # Optional: a fine-grained token (public repos, read-only) for searches only. The Actions token's
          # search quota is shared with other callers; without this secret a failed search falls back to
          # last week's projects for that source and says so in the summary.
          SEARCH_GH_TOKEN: ${{ secrets.CODE_SEARCH_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          status=0
          python3 -I tools/deck_ready_index.py --summary "$RUNNER_TEMP/out/summary.md" $ALLOW_SHRINK || status=$?
          # Show the summary even when the builder stopped (for example the shrink guard).
          [ -f "$RUNNER_TEMP/out/summary.md" ] && cat "$RUNNER_TEMP/out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: System libraries for the app's test build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libudev-dev libgl1-mesa-dev libegl1-mesa-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false

      - name: Check the new list against Import ports matching
        run: cargo test --locked -- --ignored live_lists_still_match_tims_card_and_tick_no_ordinary_folder

      - name: Commit if changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain -- index)" ]; then
            echo "index/deck-ready.json unchanged, nothing to commit" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index/deck-ready.json
          git commit -m "Refresh Deck-ready index"
          for attempt in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::could not push the refreshed index to $BRANCH"
          exit 1

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: deck-ready-summary
          path: ${{ runner.temp }}/out/summary.md
          if-no-files-found: ignore
          retention-days: 30
