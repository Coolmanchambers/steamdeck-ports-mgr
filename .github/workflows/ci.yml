name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the triggering commit)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64 tests and build
    # 22.04 keeps the glibc requirement low so the binary runs on SteamOS and older desktops.
    runs-on: ubuntu-22.04
    steps:
      # Actions are pinned to commit SHAs (the comment shows the tag) because the sync workflow
      # calls this file with write permissions.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: System libraries for Slint, winit and gilrs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libudev-dev libgl1-mesa-dev libegl1-mesa-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Upstream code built by the sync workflow must not seed the cache that main restores.
          save-if: ${{ !inputs.ref }}

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Show runtime requirements (newest glibc symbol, shared libraries)
        run: |
          objdump -T target/release/ports_launcher | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          ldd target/release/ports_launcher

      - name: Package
        run: |
          pkg=steamdeck-ports-mgr
          mkdir -p "dist/$pkg"
          install -m 755 target/release/ports_launcher "dist/$pkg/ports_launcher"
          install -m 755 7zzs "dist/$pkg/7zzs"
          # Starter catalog for an offline first launch; the app refreshes both from upstream.
          install -m 644 ports.json themes.json "dist/$pkg/"
          # The fork's own updater, under the name the app looks for. Upstream's script is left out:
          # it would replace this build with upstream's release.
          install -m 755 tools/fork-updater.sh "dist/$pkg/ports_launcher_updater.sh"
          tar -C dist -czf "dist/$pkg-linux-x86_64.tar.gz" "$pkg"
          tar -tzvf "dist/$pkg-linux-x86_64.tar.gz"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: steamdeck-ports-mgr-linux-x86_64
          path: dist/steamdeck-ports-mgr-linux-x86_64.tar.gz
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish the rolling release
    needs: linux
    # Only a real push to main. When upstream-sync calls this file, inputs.ref is set and the event is
    # the caller's, so an unmerged sync branch can never be published.
    if: ${{ !inputs.ref && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: steamdeck-ports-mgr-linux-x86_64
          path: dist

      - name: Replace the "rolling" release with this build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          asset=steamdeck-ports-mgr-linux-x86_64.tar.gz
          sha256sum "$asset" > "$asset.sha256"
          cat "$asset.sha256"
          {
            echo "Rolling build of \`main\` at ${GITHUB_SHA::7}, built $(date -u '+%Y-%m-%d %H:%M') UTC."
            echo
            echo "Source for this build: https://github.com/$GH_REPO/tree/$GITHUB_SHA"
            echo
            echo "A testing and validation fork of [Nyaldee/Ports-Launcher](https://github.com/Nyaldee/Ports-Launcher)."
            echo "Install and test steps: [STEAM_DECK.md](https://github.com/$GH_REPO/blob/main/STEAM_DECK.md)."
          } > notes.md
          # Full release (not pre-release): the updater downloads from releases/latest.
          gh release delete rolling --yes --cleanup-tag 2>/dev/null || true
          gh release create rolling "$asset" "$asset.sha256" --target "$GITHUB_SHA" \
            --title "Rolling build (main)" --notes-file notes.md --latest
          gh release view rolling --json tagName,isLatest,assets --jq '"\(.tagName) latest=\(.isLatest) assets=\([.assets[].name] | join(", "))"'
